<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hoa văn nền lấy cảm hứng từ bìa album "3" của Ngọt: lưới chéo đôi + nút thắt bốn vòng -->
  <defs>
    <g id="knot">
      <path d="M0 -15 L15 0 L0 15 L-15 0Z" fill="#f26b38"/>
      <g fill="none" stroke="#ffe2d1" stroke-width="1.3" stroke-opacity=".85">
        <path d="M0 -15 L15 0 L0 15 L-15 0Z"/>
        <circle cx="0" cy="-7.2" r="4"/>
        <circle cx="0" cy="7.2" r="4"/>
        <circle cx="-7.2" cy="0" r="4"/>
        <circle cx="7.2" cy="0" r="4"/>
        <circle r="2.2"/>
      </g>
    </g>
    <g id="dot" fill="#ffe2d1" fill-opacity=".85">
      <circle r="1.6"/>
      <circle cx="0" cy="-4.2" r="1"/>
      <circle cx="0" cy="4.2" r="1"/>
      <circle cx="-4.2" cy="0" r="1"/>
      <circle cx="4.2" cy="0" r="1"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#f26b38"/>
  <g stroke="#ffe2d1" stroke-width="1.1" stroke-opacity=".7" fill="none">
    <path d="M1.8 -1.8 L65.8 62.2 M-1.8 1.8 L62.2 65.8"/>
    <path d="M1.8 65.8 L65.8 1.8 M-1.8 62.2 L62.2 -1.8"/>
  </g>
  <use xlink:href="#knot" href="#knot" x="32" y="32"/>
  <use xlink:href="#knot" href="#knot" x="0" y="0"/>
  <use xlink:href="#knot" href="#knot" x="64" y="0"/>
  <use xlink:href="#knot" href="#knot" x="0" y="64"/>
  <use xlink:href="#knot" href="#knot" x="64" y="64"/>
  <use xlink:href="#dot" href="#dot" x="32" y="0"/>
  <use xlink:href="#dot" href="#dot" x="32" y="64"/>
  <use xlink:href="#dot" href="#dot" x="0" y="32"/>
  <use xlink:href="#dot" href="#dot" x="64" y="32"/>
</svg>
