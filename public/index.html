<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier List Nhạc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="left">
      <section class="panel title-card">
        <div class="eyebrow big" id="eyebrow" data-edit="eyebrow" title="Bấm để sửa">TIER LIST NHẠC</div>
        <h1 id="title" data-edit="title" title="Bấm để sửa">NGỌT &amp; THẮNG</h1>
        <p class="desc" id="desc" data-edit="description" title="Bấm để sửa"></p>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="progress-text" id="progress-text"></div>
        <div class="session-row">
          <button class="link-btn" id="session-name" title="Đổi tên lần xếp"></button>
          <span id="save-state" class="save-state"></span>
        </div>
      </section>

      <section class="panel draw-card">
        <header class="draw-head">
          <span class="eyebrow">Bài tiếp theo</span>
          <span id="remaining" class="remaining"></span>
        </header>
        <div id="stage" class="stage empty"></div>
        <p id="hint" class="hint"></p>
        <nav class="controls">
          <button class="ctl primary" data-act="draw" title="Rút bài (Shift+Space: trả bài đang nghe về & rút bài khác)">🎲 RÚT <kbd>Space</kbd></button>
          <button class="ctl" data-act="vote" title="Vote với bạn bè">⏱ Vote <kbd>T</kbd></button>
          <button class="ctl" data-act="add" title="Thêm bài">＋ Bài <kbd>A</kbd></button>
          <button class="ctl" data-act="remove" title="Bỏ bài này (không thích / không xếp)">✕ Bỏ <kbd>X</kbd></button>
          <button class="ctl" data-act="rules" title="Luật & phím tắt">Luật <kbd>C</kbd></button>
          <button class="ctl" data-act="undo" title="Hoàn tác">↶ <kbd>Z</kbd></button>
          <button class="ctl" data-act="menu" title="Menu: lịch sử, nhật ký, xuất kết quả…">⋯ <kbd>M</kbd></button>
        </nav>
      </section>
    </aside>

    <main class="panel board">
      <div id="tiers" class="tiers"></div>
      <div id="removed" class="removed-zone"></div>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="x" aria-label="Đóng">✕</button>
    </form>
    <div id="modal-body" class="modal-body"></div>
  </dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
