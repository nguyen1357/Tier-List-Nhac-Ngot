<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier List Nhạc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="left">
      <section class="panel title-card">
        <div class="eyebrow big" id="eyebrow" data-edit="eyebrow" title="Bấm để sửa">TIER LIST NHẠC</div>
        <h1 id="title" data-edit="title" title="Bấm để sửa">NGỌT &amp; THẮNG</h1>
        <p class="desc" id="desc" data-edit="description" title="Bấm để sửa"></p>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="progress-text" id="progress-text"></div>
        <div class="session-row">
          <button class="link-btn" id="session-name" title="Đổi tên lần xếp"></button>
          <span id="save-state" class="save-state"></span>
        </div>
      </section>

      <section class="panel draw-card">
        <header class="draw-head">
          <span class="eyebrow">Bài đang nghe</span>
          <span class="head-chips">
            <span id="remaining" class="remaining"></span>
          </span>
        </header>
        <div id="stage" class="stage empty"></div>
        <div id="picker" class="picker" hidden></div>
        <nav class="controls">
          <button class="ctl primary" id="draw-btn" data-act="draw" title="Rút bài (Space)">🎲 Rút bài</button>
          <button class="ctl icon" data-act="undo" title="Hoàn tác (Z)" aria-label="Hoàn tác">↶</button>
          <button class="ctl icon" data-act="vote" title="Vote cùng bạn bè (T)" aria-label="Vote">⏱</button>
          <button class="ctl icon toggle" id="shuffle-btn" data-act="shuffle" title="Ngẫu nhiên (S)" aria-label="Ngẫu nhiên" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
          <button class="ctl icon" data-act="music" title="Menu nhạc: chọn album, bài sẽ xếp (F)" aria-label="Menu nhạc">♫</button>
          <button class="ctl icon" data-act="rules" title="Cách chơi (C)" aria-label="Cách chơi">?</button>
          <button class="ctl icon" data-act="menu" title="Menu (M)" aria-label="Menu">⋯</button>
        </nav>
      </section>
    </aside>

    <main class="panel board">
      <div id="tiers" class="tiers"></div>
      <div id="removed" class="removed-zone"></div>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="x" aria-label="Đóng">✕</button>
    </form>
    <div id="modal-body" class="modal-body"></div>
  </dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
